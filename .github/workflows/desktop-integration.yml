name: Desktop integration

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    paths:
      - 'desktop/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/build-desktop-contract.mjs'
      - 'src/**'
      - '.github/workflows/desktop-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run check
      - run: npm --prefix desktop run verify:vendor
      - run: npm --prefix desktop run test:ui-contract
      - name: Prepare pinned public ReShade test dependency
        run: python desktop/scripts/prepare-ui-test-reshade.py
      - name: Settings and upgrade preservation
        working-directory: desktop
        run: node --test test/state-store-startup.test.js test/startup-ui.test.js test/version-selection.test.js test/payload-source.test.js test/bundled-core-update.test.js test/core-menu.test.js test/game-assessment.test.js test/package-release-policy.test.js test/packaged-validation-environment.test.js
      - name: Unified game page
        run: npm --prefix desktop run test:game-page
      - name: Maintenance actions stay bound to the selected game
        run: npm --prefix desktop run test:game-page
        env:
          GAME_UI_MAINTENANCE_SWITCH: '1'
      - name: HoYoShade workflow
        run: npm --prefix desktop run test:game-page
        env:
          GAME_UI_HOYO: '1'
      - name: Integration regressions
        working-directory: desktop
        run: npx --no-install electron test/ui-upgrade-integration.electron.cjs
      - name: Build external-component application
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm --prefix desktop run build:external
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaged startup or explicit hosted-environment limitation
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: desktop
        run: node scripts/validate-packaged-startup.cjs
      - name: Stage validation notes and checksums
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          Copy-Item docs/PR5-TESTING.md desktop/dist-external/TESTING.md
          Copy-Item desktop/build/validation/packaged-startup-status.json desktop/dist-external/STARTUP-STATUS.json
          $lines = Get-ChildItem desktop/dist-external/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          if (-not $lines) { throw 'No built executables' }
          $lines | Set-Content desktop/dist-external/SHA256SUMS.txt -Encoding utf8
          $startup = (Get-Content desktop/dist-external/STARTUP-STATUS.json -Raw | ConvertFrom-Json).status
          "Source commit: $env:GITHUB_SHA`nCore/NR runtime bundled: no`nPackaged ordinary-token startup: $startup (see STARTUP-STATUS.json)`nReal-game validation: pending`nCandidate only; not a stable release" | Set-Content desktop/dist-external/BUILD.txt -Encoding utf8
      - name: Preserve test application
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: manager-ui-validation-${{ github.sha }}
          path: |
            desktop/dist-external/*.exe
            desktop/dist-external/TESTING.md
            desktop/dist-external/SHA256SUMS.txt
            desktop/dist-external/BUILD.txt
            desktop/dist-external/STARTUP-STATUS.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-validation-reports-${{ github.sha }}
          path: desktop/build/validation/
          if-no-files-found: ignore
          retention-days: 7

  mfg-09-zh-source-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned upstream and localized overlay boundary
        working-directory: desktop
        run: node scripts/verify-fg-mfgunlock-source.js
      - name: Prepare pinned build dependencies
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/clshortfuse/renodx.git desktop/build/renodx-source
          git -C desktop/build/renodx-source checkout 8d360960a8bdeccada1a1babf7f02215c15c82e8
          git -C desktop/build/renodx-source submodule update --init --recursive
          Invoke-WebRequest -Uri https://github.com/microsoft/Detours/archive/9764cebcb1a75940e68fa83d6730ffaf0f669401.zip -OutFile desktop/build/detours-9764ceb.zip
      - name: Build reproducible Chinese MFG 0.9 panel
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ Build Tools not found' }
          $vcvars = Join-Path $install 'VC/Auxiliary/Build/vcvarsall.bat'
          ./desktop/scripts/build-fg-mfgunlock.ps1 -OutputDirectory ./desktop/build/mfg-0.9-zh -DependencyRoot ./desktop/build/renodx-source -DetoursArchive ./desktop/build/detours-9764ceb.zip -VcVarsAll $vcvars
      - name: Preserve Chinese MFG 0.9 candidate
        uses: actions/upload-artifact@v4
        with:
          name: mfgunlock-0.9-zh-CN-${{ github.sha }}
          path: |
            desktop/build/mfg-0.9-zh/renodx-mfgunlock.addon64
            desktop/build/mfg-0.9-zh/build-mfgunlock.json
            desktop/build/mfg-0.9-zh/build-mfgunlock.log
          if-no-files-found: error
          retention-days: 14
